name: CI

on:
  push:
    branches: [master]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    paths-ignore:
      - '**.md'
  pull_request: {}
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  BUILD_SDK_VER: "11.0.x"
  BUILD_SDK_MIN_VER: "11.0.100"

jobs:
  build-and-test-netfw:
    strategy:
      matrix:
        dotnet-version: [
          {sdk: "4.6.2", tfm: net462},
          {sdk: "4.8.1", tfm: net481},
        ]
    name: Build & test on .NET ${{ matrix.dotnet-version.sdk }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.BUILD_SDK_VER }}
      - name: Build
        run: |
          dotnet build test/FileLogger.Test/FileLogger.Test.csproj -c Release -f ${{ matrix.dotnet-version.tfm }} /p:CITargetFramework=${{ matrix.dotnet-version.tfm }}
      - name: Test
        run: |
          dotnet test test/FileLogger.Test/FileLogger.Test.csproj -c Release -f ${{ matrix.dotnet-version.tfm }} --no-build /p:CITargetFramework=${{ matrix.dotnet-version.tfm }}

  build-and-test-netcore:
    strategy:
      matrix:
        dotnet-version: [
          {sdk: "2.1.x", sdkMin: "2.1.100", tfm: netcoreapp2.1}, # for testing netstandard2.0 build
          {sdk: "3.1.x", sdkMin: "3.1.100", tfm: netcoreapp3.1}, # for testing netstandard2.1 build
          {sdk: "8.0.x", sdkMin: "8.0.100", tfm: net8.0},
          {sdk: "9.0.x", sdkMin: "9.0.100", tfm: net9.0},
          {sdk: "10.0.x", sdkMin: "10.0.100", tfm: net10.0},
          {sdk: "11.0.x", sdkMin: "11.0.100", tfm: net11.0}
        ]
        os: [ubuntu-latest, windows-latest, macOS-latest]
        exclude:
          - dotnet-version: {sdk: "2.1.x", sdkMin: "2.1.100", tfm: netcoreapp2.1}
            os: ubuntu-latest
          - dotnet-version: {sdk: "2.1.x", sdkMin: "2.1.100", tfm: netcoreapp2.1}
            os: macOS-latest
          - dotnet-version: {sdk: "3.1.x", sdkMin: "3.1.100", tfm: netcoreapp3.1}
            os: ubuntu-latest
          - dotnet-version: {sdk: "3.1.x", sdkMin: "3.1.100", tfm: netcoreapp3.1}
            os: macOS-latest
    name: Build & test on .NET ${{ matrix.dotnet-version.sdk }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            ${{ env.BUILD_SDK_VER }}
            ${{ matrix.dotnet-version.sdk }}
      - name: Build
        run: |
          dotnet build test/FileLogger.Test/FileLogger.Test.csproj -c Release -f ${{ matrix.dotnet-version.tfm }} /p:CITargetFramework=${{ matrix.dotnet-version.tfm }}
      - name: Pin dotnet SDK version
        run: |
          dotnet new global.json --sdk-version ${{ matrix.dotnet-version.sdkMin }} --roll-forward latestFeature --force
      - name: Test
        run: |
          dotnet test test/FileLogger.Test/FileLogger.Test.csproj -c Release -f ${{ matrix.dotnet-version.tfm }} --no-build /p:CITargetFramework=${{ matrix.dotnet-version.tfm }}

  publish:
    needs: [
      build-and-test-netfw,
      build-and-test-netcore
    ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags')
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.BUILD_SDK_VER }}

    - name: Determine version
      run: |
        arrTag=(${GITHUB_REF//\// })
        VERSION="${arrTag[2]}"
        VERSION="${VERSION#v}"
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    # See also: https://andrewlock.net/version-vs-versionsuffix-vs-packageversion-what-do-they-all-mean/
    - name: Build
      run: |
        dotnet build FileLogger.slnx -c Release /p:ContinuousIntegrationBuild=true /p:Version=$VERSION /p:BuildNumber=$GITHUB_RUN_NUMBER

    - name: Pack
      run: |
        dotnet pack FileLogger.slnx -c Release --no-build /p:Version=$VERSION /p:BuildNumber=$GITHUB_RUN_NUMBER

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: artifacts/package/release

    - name: Log in to NuGet (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    # Symbol packages are auto-pushed, see: https://learn.microsoft.com/en-us/nuget/create-packages/symbol-packages-snupkg#publishing-a-symbol-package
    - name: Push to NuGet
      run: |
        dotnet nuget push artifacts/package/release/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
